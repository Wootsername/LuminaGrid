<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminaGrid — Notifications & Alerts</title>
  <meta name="description"
    content="LuminaGrid Notifications & Alerts — Real-time fault notifications and GSM SMS alerts log">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="app-shell">

    <!-- Top bar -->
    <div class="topbar">
      <div class="brand">
        <img src="assets/logo2.png" alt="LuminaGrid">
      </div>
      <div class="nav-links" id="navLinks">
        <a href="fault-records.html" data-roles="admin,electrician"><span class="nav-icon">📋</span> History</a>
        <a href="energy-analytics.html" data-roles="admin,finance"><span class="nav-icon">📊</span> Report</a>
        <a href="notifications.html" class="active" data-roles="admin,electrician,finance"><span
            class="nav-icon">🔔</span> Notification</a>
        <a href="energy_data.html" data-roles="admin,finance"><span class="nav-icon">⚡</span> Energy</a>
        <a href="dashboard.html"><span class="nav-icon">📍</span> Dashboard</a>
        <a href="node-management.html" data-roles="admin"><span class="nav-icon">⚙️</span> Admin</a>
      </div>
      <div class="user-chip">
        <span id="userName">—</span>
        <span class="role-badge" id="userRole">—</span>
        <button class="logout-btn" id="logoutLink">🚪 logout</button>
      </div>
    </div>

    <div class="page-wrap">

      <div class="page-header">
        <div>
          <h2>Notifications & GSM Alerts</h2>
          <p class="subtitle">Real-time alert dispatch log for Barangay Guadalupe control center & automated SMS
            notifications.</p>
        </div>
      </div>

      <!-- Notifications Panel -->
      <div class="notif-panel">
        <div class="notif-toolbar">
          <div class="notif-bell-wrap">
            <button class="notif-bell-btn" type="button" title="Alerts">🔔</button>
            <span class="notif-bell-badge" id="notifUnreadBadge" style="display:none;">0</span>
          </div>
          <div class="notif-search-wrap">
            <span class="notif-mag">🔍</span>
            <input type="text" id="notifSearchInput" placeholder="Search by node, pole, or address">
          </div>
          <label class="notif-date-select">
            📅
            <select id="notifDateFilter">
              <option value="">All dates</option>
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
            </select>
          </label>
        </div>

        <table class="notif-table">
          <thead>
            <tr>
              <th class="notif-icon-col"></th>
              <th>Date</th>
              <th>Node ID</th>
              <th>Pole ID</th>
              <th>Address</th>
              <th class="notif-action-col">Action</th>
            </tr>
          </thead>
          <tbody id="notificationsList">
            <tr>
              <td colspan="6" class="empty-state">Loading notifications...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <!-- Notification Detail Modal -->
    <div class="modal-backdrop" id="notifModal">
      <div class="card" style="max-width:440px;">
        <h2 id="notifModalTitle">Notification</h2>
        <div class="sub" id="notifModalBody"></div>
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button type="button" class="btn btn-secondary" id="notifModalCloseBtn">Close</button>
          <button type="button" class="btn btn-amber" id="notifMarkReadBtn" style="display:none;">Mark read</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/notifications.js"></script>
</body>

</html>
