<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminaGrid — System Logs & Analytics</title>
  <meta name="description"
    content="LuminaGrid System Logs — Chronological event trail and system analytics for monitoring nodes and telemetry">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="app-shell">

    <!-- Top bar -->
    <div class="topbar">
      <div class="brand">
        <img src="assets/logo2.png" alt="LuminaGrid">
      </div>
      <div class="nav-links" id="navLinks">
        <a href="fault-records.html" data-roles="admin,electrician"><span class="nav-icon">📋</span> History</a>
        <a href="energy-analytics.html" data-roles="admin,finance"><span class="nav-icon">📊</span> Report</a>
        <a href="notifications.html" data-roles="admin,electrician,finance"><span class="nav-icon">🔔</span>
          Notification</a>
        <a href="energy_data.html" data-roles="admin,finance"><span class="nav-icon">⚡</span> Energy</a>
        <a href="dashboard.html" data-roles="admin,electrician,finance"><span class="nav-icon">📍</span> Dashboard</a>
        <a href="node-management.html" class="active" data-roles="admin"><span class="nav-icon" aria-hidden="true"></span> Admin</a>
      </div>
      <div class="user-chip">
        <span id="userName">—</span>
        <span class="role-badge" id="userRole">—</span>
        <button class="logout-btn" id="logoutLink">🚪 logout</button>
      </div>
    </div>

    <div class="page-wrap">
      <div class="page-header">
        <div>
          <h2>System Logs & Audit Analytics</h2>
          <p class="subtitle">Real-time event logs of node heartbeats, fault detections, and system operations.</p>
        </div>
      </div>

      <!-- Logs Table Card -->
      <div class="card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Event Type</th>
              <th>Details & Message</th>
            </tr>
          </thead>
          <tbody id="logTableBody">
            <tr>
              <td colspan="3" class="empty-state">Loading system logs...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/system-logs.js"></script>
</body>

</html>
