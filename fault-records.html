<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminaGrid — Fault Records</title>
  <meta name="description"
    content="LuminaGrid Fault Records — Comprehensive log of detected streetlight faults and resolutions">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="app-shell">

    <!-- Top bar -->
    <div class="topbar">
      <div class="brand">
        <span class="dot"></span>
        LuminaGrid
      </div>
      <div class="nav-links" id="navLinks">
        <a href="fault-records.html" class="active" data-roles="admin,electrician"><span class="nav-icon">📋</span>
          History</a>
        <a href="energy-analytics.html" data-roles="admin,finance"><span class="nav-icon">📊</span> Report</a>
        <a href="notifications.html" data-roles="admin,electrician,finance"><span class="nav-icon">🔔</span>
          Notification</a>
        <a href="energy_data.html" data-roles="admin,finance"><span class="nav-icon">⚡</span> Energy</a>
        <a href="dashboard.html"><span class="nav-icon">📍</span> Dashboard</a>
        <a href="node-management.html" data-roles="admin"><span class="nav-icon">⚙️</span> Admin</a>
      </div>
      <div class="user-chip">
        <span id="userName">—</span>
        <span class="role-badge" id="userRole">—</span>
        <button class="logout-btn" id="logoutLink">🚪 logout</button>
      </div>
    </div>

    <div class="page-wrap">
      <div class="page-header">
        <div>
          <h2>Fault Detection & History Records</h2>
          <p class="subtitle">Full history of detected faults across Barangay Guadalupe monitoring nodes.</p>
        </div>
        <select id="statusFilter"
          style="padding:8px 14px; border-radius:var(--radius-xs); border:1px solid var(--gray-300); font-family:var(--font-ui); background:var(--white);">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>

      <div class="card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Fault ID</th>
              <th>Node / Pole</th>
              <th>Fault Type</th>
              <th>Severity</th>
              <th>Status</th>
              <th>Detected At</th>
              <th>Resolved At</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="faultTableBody">
            <tr>
              <td colspan="8" class="empty-state">Loading fault records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/fault-records.js"></script>
</body>

</html>
