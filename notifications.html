<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminaGrid — Notifications & Alerts</title>
  <meta name="description"
    content="LuminaGrid Notifications & Alerts — Real-time fault notifications and GSM SMS alerts log">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="app-shell">

    <!-- Top bar -->
    <div class="topbar">
      <div class="brand">
        <span class="dot"></span>
        LuminaGrid
      </div>
      <div class="nav-links" id="navLinks">
        <a href="fault-records.html" data-roles="admin,electrician"><span class="nav-icon">📋</span> History</a>
        <a href="energy-analytics.html" data-roles="admin,finance"><span class="nav-icon">📊</span> Report</a>
        <a href="notifications.html" class="active" data-roles="admin,electrician,finance"><span
            class="nav-icon">🔔</span> Notification</a>
        <a href="energy-analytics.html" data-roles="admin,finance"><span class="nav-icon">⚡</span> Energy</a>
        <a href="dashboard.html"><span class="nav-icon">📍</span> Dashboard</a>
        <a href="node-management.html" data-roles="admin"><span class="nav-icon">⚙️</span> Admin</a>
      </div>
      <div class="user-chip">
        <span id="userName">—</span>
        <span class="role-badge" id="userRole">—</span>
        <button class="logout-btn" id="logoutLink">🚪 logout</button>
      </div>
    </div>

    <div class="page-wrap">

      <div class="page-header">
        <div>
          <h2>Notifications & GSM Alerts</h2>
          <p class="subtitle">Real-time alert dispatch log for Barangay Guadalupe control center & automated SMS
            notifications.</p>
        </div>
      </div>

      <!-- Notifications Card -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h3>Alert Feed</h3>
          <span style="font-size:0.8rem; color:var(--gray-400);" id="unreadBannerText">0 unread notifications</span>
        </div>
        <div id="notificationsList">
          <div class="empty-state">Loading notifications...</div>
        </div>
      </div>

    </div>

  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/notifications.js"></script>
</body>

</html>
