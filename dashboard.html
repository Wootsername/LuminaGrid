<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuminaGrid — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<div class="app-shell">

  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      LuminaGrid
      <small>Guadalupe, Cebu City</small>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="dashboard.html" class="active">Map</a>
      <a href="energy-analytics.html" data-roles="admin,finance">Energy Analytics</a>
      <a href="node-management.html" data-roles="admin">Node Management</a>
      <a href="user-management.html" data-roles="admin">Users</a>
      <a href="fault-records.html" data-roles="admin">Fault Records</a>
      <a href="system-logs.html" data-roles="admin">System Logs</a>
    </div>
    <div class="user-chip">
      <span id="userName">—</span>
      <span class="role-badge" id="userRole">—</span>
      <a href="#" id="logoutLink" class="btn-secondary" style="padding:6px 12px;border-radius:8px;">Sign Out</a>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi-card total">
      <div class="label">Total Nodes</div>
      <div class="value" id="kpiTotal">—</div>
    </div>
    <div class="kpi-card active">
      <div class="label">Active Nodes</div>
      <div class="value" id="kpiActive">—</div>
    </div>
    <div class="kpi-card fault">
      <div class="label">Faults Reported</div>
      <div class="value" id="kpiFaults">—</div>
    </div>
    <div class="kpi-card energy">
      <div class="label">Grid Consumption</div>
      <div class="value" id="kpiEnergy">— kWh</div>
    </div>
  </div>

  <div class="main-area">
    <div id="map"></div>
    <div class="side-panel">
      <h3>Active Fault Alerts</h3>
      <div id="faultList">
        <div class="empty-state">
          <strong>Loading...</strong>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/data-service.js"></script>
<script src="js/utils.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
