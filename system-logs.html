<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuminaGrid — System Logs</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <div class="topbar">
    <div class="brand"><span class="dot"></span>LuminaGrid<small>Guadalupe, Cebu City</small></div>
    <div class="nav-links" id="navLinks">
      <a href="dashboard.html">Map</a>
      <a href="energy-analytics.html" data-roles="admin,finance">Energy Analytics</a>
      <a href="node-management.html" data-roles="admin">Node Management</a>
      <a href="user-management.html" data-roles="admin">Users</a>
      <a href="fault-records.html" data-roles="admin">Fault Records</a>
      <a href="system-logs.html" class="active" data-roles="admin">System Logs</a>
    </div>
    <div class="user-chip">
      <span id="userName">—</span>
      <span class="role-badge" id="userRole">—</span>
      <a href="#" id="logoutLink" class="btn-secondary" style="padding:6px 12px;border-radius:8px;">Sign Out</a>
    </div>
  </div>

  <div class="analytics-wrap">
    <div class="analytics-toolbar">
      <div>
        <h2 style="margin:0;">System Logs</h2>
        <p style="margin:4px 0 0 0; color:var(--slate-400); font-size:0.85rem;">
          Chronological feed of fault detections, notifications sent, and maintenance actions. Use Case: "View System Logs."
        </p>
      </div>
    </div>

    <div class="chart-panel">
      <table class="data-table">
        <thead>
          <tr><th>Time</th><th>Event</th><th>Detail</th></tr>
        </thead>
        <tbody id="logTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="js/firebase-config.js"></script>
<script src="js/data-service.js"></script>
<script src="js/utils.js"></script>
<script src="js/system-logs.js"></script>
</body>
</html>
